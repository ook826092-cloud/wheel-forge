name: fetch-bge-m3-int8
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Download prebuilt bge-m3 int8 from HF
        run: |
          pip install -q huggingface_hub
          huggingface-cli download gpahal/bge-m3-onnx-int8 --local-dir bge-m3-int8
          du -sh bge-m3-int8
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bge-m3-onnx-int8
          path: bge-m3-int8/**
