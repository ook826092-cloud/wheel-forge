name: fetch-tur-onnxruntime
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Inspect TUR PyPI index for onnxruntime
        run: |
          echo "=== TUR index onnxruntime ==="
          curl -s https://termux-user-repository.github.io/pypi/onnxruntime/ | grep -oE 'onnxruntime-[^"<]+\.whl' | sort -u | head -20
      - name: Download matching android wheel
        run: |
          # 尝试几种平台 tag（pip 自动探测）
          for plat in android_24_arm64_v8a android_arm64_v8a android_21_arm64_v8a; do
            echo "=== 尝试 --platform $plat ==="
            pip download --no-deps --platform $plat --python-version 3.14 --only-binary=:all: \
              --extra-index-url https://termux-user-repository.github.io/pypi/ \
              onnxruntime -d ort-tur 2>&1 | tail -2
            ls ort-tur/*.whl 2>/dev/null && break
          done
          ls -la ort-tur/ 2>/dev/null || echo "所有 tag 都失败"
      - uses: actions/upload-artifact@v4
        with:
          name: ort-tur-wheel
          path: ort-tur/**
          if-no-files-found: warn
