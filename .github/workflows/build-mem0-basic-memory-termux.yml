name: build-mem0-basic-memory-termux
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mem0:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Pull termux docker
        run: docker pull termux/termux-docker:latest 2>&1 | tail -1
      - name: Full deploy mem0ai + extract ALL artifacts
        run: |
          docker run --name mb --rm -d termux/termux-docker:latest sleep 3600
          docker exec mb bash -c "
            pkg update -y > /dev/null 2>&1
            pkg install -y rust python python-pip clang binutils > /dev/null 2>&1
            pip install -U maturin 2>&1 | tail -1
            pip install --user mem0ai 2>&1 | tail -2
            SP=\$(find ~/.local/lib -type d -name site-packages 2>/dev/null | head -1)
            echo "HOME=\$HOME SP=\$SP"
            mkdir -p \$HOME/out && cd \$SP && tar czf \$HOME/out/all.tar.gz . 2>/dev/null || true
            find / -name '*.deb' 2>/dev/null -exec cp {} \$HOME/out/ \; || true
            ls -la \$HOME/out/
          "
          mkdir -p output && docker cp mb:/data/data/com.termux/files/home/out/. ./output/ 2>/dev/null || true
          docker stop mb 2>/dev/null || true
          ls -la output/
      - uses: actions/upload-artifact@v4
        with:
          name: mem0-termux-all
          path: output/**
          if-no-files-found: error
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=mem0-termux-deps
          gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          FILES="$(ls output/* 2>/dev/null | tr '\n' ' ')"
          if [ -n "$FILES" ]; then
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "Mem0 Termux 全部产物" $FILES
            echo "published: $TAG"
          else echo "NO FILES"; exit 1; fi

  build-basic-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Pull termux docker
        run: docker pull termux/termux-docker:latest 2>&1 | tail -1
      - name: Full deploy basic-memory + extract ALL artifacts
        run: |
          docker run --name bb --rm -d termux/termux-docker:latest sleep 3600
          docker exec bb bash -c "
            pkg update -y > /dev/null 2>&1
            pkg install -y rust python python-pip clang binutils > /dev/null 2>&1
            pip install -U maturin 2>&1 | tail -1
            pip install --user basic-memory 2>&1 | tail -2
            SP=\$(find ~/.local/lib -type d -name site-packages 2>/dev/null | head -1)
            echo "HOME=\$HOME SP=\$SP"
            mkdir -p \$HOME/out && cd \$SP && tar czf \$HOME/out/all.tar.gz . 2>/dev/null || true
            find / -name '*.deb' 2>/dev/null -exec cp {} \$HOME/out/ \; || true
            ls -la \$HOME/out/
          "
          mkdir -p output2 && docker cp bb:/data/data/com.termux/files/home/out/. ./output2/ 2>/dev/null || true
          docker stop bb 2>/dev/null || true
          ls -la output2/
      - uses: actions/upload-artifact@v4
        with:
          name: basic-memory-termux-all
          path: output2/**
          if-no-files-found: error
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=basic-memory-termux-deps
          gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          FILES="$(ls output2/* 2>/dev/null | tr '\n' ' ')"
          if [ -n "$FILES" ]; then
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "Basic Memory Termux 全部产物" $FILES
            echo "published: $TAG"
          else echo "NO FILES"; exit 1; fi
