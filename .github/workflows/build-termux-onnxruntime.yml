name: build-termux-onnxruntime
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: master
      - name: Load docker image (official)
        run: ./scripts/run-docker.sh true
      - name: Build onnxruntime official-flow
        run: |
          set -o pipefail
          ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 onnxruntime 2>&1 | tail -20
      - name: Collect deb artifacts
        run: |
          test -d termux-packages/output && mv termux-packages/output/* ./output/ || true
          mkdir -p collected
          cp debs/*.deb collected/ 2>/dev/null || true
          cp output/*.deb collected/ 2>/dev/null || true
          ls -la collected/
      - uses: actions/upload-artifact@v4
        with:
          name: termux-onnxruntime-debs
          path: collected/**
          if-no-files-found: warn
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find . -name "*.deb" | head -6
          gh release create onnxruntime-termux-1.28.0 $(find . -name "*.deb" | head -4) \
            -R ook826092-cloud/wheel-forge --title "onnxruntime 1.28.0 (Termux bionic)" \
            --notes "termux-packages 官方构建 · aarch64 · dpkg -i 安装" 2>&1 | tail -2 \
          || gh release upload onnxruntime-termux-1.28.0 $(find . -name "*.deb" | head -4) --clobber \
            -R ook826092-cloud/wheel-forge 2>&1 | tail -2
