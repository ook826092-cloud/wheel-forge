name: fetch-gte-base-zh
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet huggingface_hub
      - name: Download GGUF (mradermacher, from thenlper original)
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p = snapshot_download('mradermacher/gte-base-zh-GGUF', local_dir='./gguf', allow_patterns=['*Q4_K_M*.gguf', '*Q8_0*.gguf', '*f16*.gguf'])
          print('gguf:', p)
          PY
          ls -la ./gguf
      - name: Download ONNX (favoryoung)
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p = snapshot_download('favoryoung/gte-base-zh-onnx', local_dir='./onnx')
          print('onnx:', p)
          PY
          find ./onnx -type f | head -20
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=gte-base-zh-ready
          gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          FILES="$(find ./gguf -name '*.gguf' | tr '\n' ' ') $(find ./onnx -type f \( -name '*.onnx*' -o -name '*.json' -o -name '*.txt' -o -name '*.model' -o -name '*.bin' \) | tr '\n' ' ')"
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "gte-base-zh (768d) GGUF+ONNX ready" $FILES
          echo "published: $TAG"
