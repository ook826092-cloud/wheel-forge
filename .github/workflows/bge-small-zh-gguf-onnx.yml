name: build-bge-small-zh-gguf-onnx
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install --quiet huggingface_hub torch optimum[exporters] transformers sentence-transformers onnxruntime
      - name: Download ORIGINAL BAAI/bge-small-zh-v1.5 from HuggingFace
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p = snapshot_download('BAAI/bge-small-zh-v1.5', local_dir='./bge-model')
          print('downloaded to', p)
          PY
          ls -la ./bge-model
      - name: Clone llama.cpp converter (on runner)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          pip install --quiet -e ./llama.cpp/gguf-py
      - name: Patch BERT tokenizer hash (compute via official CHK_TXT)
        run: |
          pip install --quiet transformers
          python - <<'PY'
          import hashlib, sys
          sys.path.insert(0, 'llama.cpp')
          from convert_hf_to_gguf_update import CHK_TXT
          from transformers import AutoTokenizer
          p = 'llama.cpp/conversion/base.py'
          src = open(p).read()
          tok = AutoTokenizer.from_pretrained('./bge-model')
          chkhsh = hashlib.sha256(str(tok.encode(CHK_TXT)).encode()).hexdigest()
          print('computed hash:', chkhsh)
          if chkhsh not in src:
              idx = src.find('def get_vocab_base_pre')
              eol = src.find('):', idx)
              if idx == -1 or eol == -1:
                  raise SystemExit('signature not found')
              ins = '\n        if chkhsh == "' + chkhsh + '":\n            return "bert"\n'
              src = src[:eol+2] + ins + src[eol+2:]
              open(p, 'w').write(src)
              print('patched with computed hash')
          else:
              print('hash already present')
          PY
      - name: Convert to GGUF (f16 + q8_0)
        run: |
          python llama.cpp/convert_hf_to_gguf.py ./bge-model --outtype f16 --outfile bge-small-zh-v1.5-f16.gguf
          python llama.cpp/convert_hf_to_gguf.py ./bge-model --outtype q8_0 --outfile bge-small-zh-v1.5-q8_0.gguf
          ls -la *.gguf
      - name: Convert to ONNX (sentence-similarity, includes pooling+normalize)
        run: |
          optimum-cli export onnx --model ./bge-model --task sentence-similarity ./bge-onnx
          find ./bge-onnx -type f | head -20
      - name: Quantize ONNX to int8 (arm64-friendly)
        run: |
          python - <<'PY'
          from optimum.onnxruntime import ORTQuantizer
          from optimum.onnxruntime.configuration import AutoQuantizationConfig
          quantizer = ORTQuantizer.from_pretrained('./bge-onnx')
          dq = AutoQuantizationConfig.arm64(is_static=False)
          quantizer.quantize(save_dir='./bge-onnx-q8', quantization_config=dq)
          print('quantized ok')
          PY
          ls -la ./bge-onnx-q8
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=bge-small-zh-v1.5-gguf-onnx
          gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          FILES="bge-small-zh-v1.5-f16.gguf bge-small-zh-v1.5-q8_0.gguf"
          FILES="$FILES $(find ./bge-onnx -type f -name '*.onnx' | tr '\n' ' ')"
          FILES="$FILES $(find ./bge-onnx-q8 -type f -name '*.onnx' | tr '\n' ' ')"
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "bge-small-zh-v1.5 GGUF+ONNX (from BAAI original)" $FILES
          echo "published: $TAG"
