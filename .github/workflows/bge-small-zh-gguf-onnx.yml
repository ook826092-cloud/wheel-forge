name: build-bge-small-zh-gguf-onnx
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install --quiet huggingface_hub torch optimum[exporters] transformers
      - name: Download ORIGINAL BAAI/bge-small-zh-v1.5 from HuggingFace
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p = snapshot_download('BAAI/bge-small-zh-v1.5', local_dir='./bge-model')
          print('downloaded to', p)
          PY
          ls -la ./bge-model
      - name: Clone llama.cpp converter (on runner, not local)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          pip install --quiet -e ./llama.cpp/gguf-py
      - name: Patch BERT tokenizer hash (bge uses WordPiece, may not be registered)
        run: |
          python - <<'PY'
          import re
          p = 'llama.cpp/conversion/base.py'
          src = open(p).read()
          if '56a3532a4cda32cf10d09834e0cdeee45c407d750b868651e44e2eebdcc721ed' not in src:
              marker = '        raise NotImplementedError(\n            "BPE pre-tokenizer was not recognized'
              patch = '        if chkhsh == "56a3532a4cda32cf10d09834e0cdeee45c407d750b868651e44e2eebdcc721ed":\n            return "bert"\n'
              if marker in src:
                  src = src.replace(marker, patch + marker, 1)
                  open(p, 'w').write(src)
                  print('patched tokenizer hash')
              else:
                  print('marker not found, trying after any raise NotImplementedError')
          else:
              print('hash already present')
          PY
      - name: Convert to GGUF (f16 + q8_0)
        run: |
          python llama.cpp/convert_hf_to_gguf.py ./bge-model --outtype f16 --outfile bge-small-zh-v1.5-f16.gguf
          python llama.cpp/convert_hf_to_gguf.py ./bge-model --outtype q8_0 --outfile bge-small-zh-v1.5-q8_0.gguf
          ls -la *.gguf
      - name: Convert to ONNX (for onnxruntime)
        run: |
          optimum-cli export onnx --model ./bge-model --task feature-extraction ./bge-onnx
          find ./bge-onnx -type f | head -20
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=bge-small-zh-v1.5-gguf-onnx
          gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          FILES="bge-small-zh-v1.5-f16.gguf bge-small-zh-v1.5-q8_0.gguf"
          FILES="$FILES $(find ./bge-onnx -type f | tr '\n' ' ')"
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "bge-small-zh-v1.5 GGUF+ONNX (from BAAI original)" $FILES
          echo "published: $TAG"
