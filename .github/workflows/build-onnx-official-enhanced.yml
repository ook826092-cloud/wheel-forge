name: build-onnx-official-enhanced
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: master
      - name: Load docker image (official)
        run: ./scripts/run-docker.sh true
      - name: Build official params + FULL-DISK wheel search + grab deb
        run: |
          set -o pipefail
          mkdir -p $HOME/.termux-build
          docker run --privileged -v $PWD:/src -v $HOME/.termux-build:/home/builder/.termux-build \
            -w /src ghcr.io/termux/package-builder bash -c "
            ./build-package.sh -I -C -a aarch64 onnxruntime 2>&1 | tail -8
            echo '=== 全盘搜索 wheel ==='
            W=\$(find / -name 'onnxruntime-*.whl' 2>/dev/null | head -1)
            echo 'WHEEL: '\$W
            [ -n "\$W" ] && cp \$W /src/ && echo '✅ wheel 已复制'
            echo '=== 搜索 deb ==='
            D=\$(find / -name 'onnxruntime*.deb' 2>/dev/null | head -1)
            echo 'DEB: '\$D
            [ -n "\$D" ] && cp \$D /src/ && echo '✅ deb 已复制'
            ls -la /src/ | grep -E 'whl|deb' || echo '/src 无产物'
          "
      - name: Show host results
        run: |
          ls -la *.whl *.deb 2>/dev/null || echo '宿主暂无产物'
      - uses: actions/upload-artifact@v4
        with:
          name: ort-official-enhanced
          path: |
            *.whl
            *.deb
          if-no-files-found: warn
