name: convert-bge-m3-mnn
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Download bge-m3 int8 onnx
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("gpahal/bge-m3-onnx-int8", local_dir="model")
          PY
          ls -la model/
      - name: Checkout MNN source
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          ref: 3.6.1
          path: mnn-src
      - name: Build MNNConvert
        run: |
          sudo apt-get update
          sudo apt-get install -y libprotobuf-dev protobuf-compiler
          cd mnn-src && mkdir -p build && cd build
          cmake .. -DMNN_BUILD_CONVERTER=ON -DMNN_BUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          make MNNConvert -j$(nproc) 2>&1 | tail -3
      - name: Convert ONNX to MNN
        run: |
          ./mnn-src/build/MNNConvert -f ONNX --modelFile model/model_quantized.onnx --MNNModel bge-m3-int8.mnn --bizCode bge-m3 2>&1 | tail -20
          ls -la bge-m3-int8.mnn
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bge-m3-mnn
          path: bge-m3-int8.mnn
