name: fetch-bge-reranker
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet huggingface_hub
      - name: Download onnx-community/bge-reranker-base-ONNX (official org)
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p = snapshot_download('onnx-community/bge-reranker-base-ONNX', local_dir='./onnx')
          print('onnx:', p)
          PY
          find ./onnx -type f -exec ls -la {} \; | head -20
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=bge-reranker-base-onnx-ready
          gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          FILES="$(find ./onnx -type f ! -name '*.lock' | tr '\n' ' ')"
          gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "bge-reranker-base ONNX (onnx-community)" $FILES
          echo "published: $TAG"
